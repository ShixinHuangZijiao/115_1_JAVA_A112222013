<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:942px;height:464px;background:#FFFFFF;" width="942px" height="464px" viewBox="0 0 942 464" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="299.76" y="25.06" fill="#000" font-size="14" textLength="335.979" font-weight="700" font-family="'Microsoft JhengHei'">E3｜模擬 AI 版：一個 HeavyRover 物件裡的兩份狀態</text><text x="283.016" y="43.681" fill="#000" font-size="14" textLength="369.469" font-weight="700" font-family="'Microsoft JhengHei'">new HeavyRover(20, 0) 之後，第一次 drill() 回傳「成功」</text></g><g class="entity" data-qualified-name="h" id="ent0001" data-source-line="8"><rect x="362.5" y="70.242" width="269.445" height="203.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="369.5" y="89.453" fill="#000" font-size="16" textLength="255.445" font-family="'Microsoft JhengHei'">h : HeavyRover（只有這一個物件）</text><line x1="363.5" y1="95.523" x2="630.945" y2="95.523" style="stroke:#181818;stroke-width:0.5;"/><text x="368.5" y="116.734" fill="#000" font-size="16" textLength="180.883" font-family="'Microsoft JhengHei'">── Rover 宣告的欄位 ──</text><text x="368.5" y="138.016" fill="#000" font-size="16" textLength="90.5" font-family="'Microsoft JhengHei'">energy = 20</text><text x="368.5" y="159.297" fill="#000" font-size="16" textLength="90.523" font-family="'Microsoft JhengHei'">samples = 0</text><text x="368.5" y="180.578" fill="#000" font-size="16" textLength="121.625" font-family="'Microsoft JhengHei'">actionCount = 0</text><text x="368.5" y="201.859" fill="#000" font-size="16" textLength="232.977" font-family="'Microsoft JhengHei'">── AI 子類別另外宣告的欄位 ──</text><text x="368.5" y="223.141" fill="#000" font-size="16" textLength="90.5" font-family="'Microsoft JhengHei'">energy = 12</text><text x="368.5" y="244.422" fill="#000" font-size="16" textLength="90.523" font-family="'Microsoft JhengHei'">samples = 3</text><text x="368.5" y="265.703" fill="#000" font-size="16" textLength="103.664" font-family="'Microsoft JhengHei'">drillCount = 1</text></g><g class="entity" data-qualified-name="GMN2" id="ent0003" data-source-line="20"><path d="M6,114.242 L6,230.648 A0,0 0 0 0 6,230.648 L343.898,230.648 A0,0 0 0 0 343.898,230.648 L343.898,176.242 L362.383,172.242 L343.898,168.242 L343.898,124.242 L333.898,114.242 L6,114.242 A0,0 0 0 0 6,114.242" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M333.898,114.242 L333.898,124.242 L343.898,124.242 L333.898,114.242" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="136.453" fill="#000" font-size="16" textLength="97.063" font-weight="700" font-family="'Microsoft JhengHei'">Rover 的方法</text><text x="12" y="157.734" fill="#000" font-size="16" textLength="217.609" font-family="'Microsoft JhengHei'">getEnergy()、getSamples()、</text><text x="12" y="179.016" fill="#000" font-size="16" textLength="316.898" font-family="'Microsoft JhengHei'">getActionCount()、isStopped()、execute()</text><text x="12" y="200.297" fill="#000" font-size="16" textLength="48" font-family="'Microsoft JhengHei'">只讀寫</text><text x="64" y="200.297" fill="#000" font-size="16" textLength="129.063" font-weight="700" font-family="'Microsoft JhengHei'">Rover 宣告的那份</text><text x="12" y="221.578" fill="#000" font-size="16" textLength="156.172" font-family="'Microsoft JhengHei'">→ getter 讀到 20/0/0</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="28"><path d="M649.5,124.742 L649.5,168.242 L631.701,172.242 L649.5,176.242 L649.5,219.867 A0,0 0 0 0 649.5,219.867 L926.656,219.867 A0,0 0 0 0 926.656,219.867 L926.656,134.742 L916.656,124.742 L649.5,124.742 A0,0 0 0 0 649.5,124.742" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M916.656,124.742 L916.656,134.742 L926.65