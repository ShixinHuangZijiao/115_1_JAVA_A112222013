<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:649px;height:261px;background:#FFFFFF;" width="649px" height="261px" viewBox="0 0 649 261" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="241.434" y="25.06" fill="#000" font-size="14" textLength="159.633" font-weight="700" font-family="'Microsoft JhengHei'">E1｜樣本運送盒 人工初版</text></g><!--class SampleCase--><g class="entity" data-qualified-name="SampleCase" id="ent0001" data-source-line="8"><rect x="6" y="51.621" width="208.171" height="193.59" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="69.938" y="71.681" fill="#000" font-size="14" textLength="80.295" font-family="'Microsoft JhengHei'">SampleCase</text><line x1="7" y1="80.242" x2="213.171" y2="80.242" style="stroke:#181818;stroke-width:0.5;"/><text x="12" y="99.302" fill="#000" font-size="14" textLength="87.575" font-family="'Microsoft JhengHei'">-capacity : int</text><text x="12" y="117.923" fill="#000" font-size="14" textLength="71.408" font-family="'Microsoft JhengHei'">-count : int</text><line x1="7" y1="125.484" x2="213.171" y2="125.484" style="stroke:#181818;stroke-width:0.5;"/><text x="12" y="144.544" fill="#000" font-size="14" textLength="181.132" font-family="'Microsoft JhengHei'">+SampleCase(capacity : int)</text><text x="12" y="163.165" fill="#000" font-size="14" textLength="125.063" font-family="'Microsoft JhengHei'">+getCapacity() : int</text><text x="12" y="181.786" fill="#000" font-size="14" textLength="108.896" font-family="'Microsoft JhengHei'">+getCount() : int</text><text x="12" y="200.407" fill="#000" font-size="14" textLength="136.309" font-family="'Microsoft JhengHei'">+getFreeSpace() : int</text><text x="12" y="219.028" fill="#000" font-size="14" textLength="196.171" font-family="'Microsoft JhengHei'">+store(amount : int) : boolean</text><text x="12" y="237.649" fill="#000" font-size="14" textLength="92.791" font-family="'Microsoft JhengHei'">+unload() : int</text></g><g class="entity" data-qualified-name="GMN2" id="ent0003" data-source-line="20"><path d="M232.5,83.121 L232.5,144.621 L214.092,148.621 L232.5,152.621 L232.5,214.158 A0,0 0 0 0 232.5,214.158 L633.122,214.158 A0,0 0 0 0 633.122,214.158 L633.122,93.121 L623.122,83.121 L232.5,83.121 A0,0 0 0 0 232.5,83.121" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M623.122,83.121 L623.122,93.121 L633.122,93.121 L623.122,83.121" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="238.5" y="102.105" fill="#000" font-size="13" textLength="343.764" font-family="'Microsoft JhengHei'">建構：capacity &lt; 1 設為 1；> 8 設為 8；count 從 0 開始。</text><text x="238.5" y="119.396" fill="#000" font-size="13" textLength="379.622" font-family="'Microsoft JhengHei'">store：amount > 0 且 amount &lt;= 剩餘空間才存入並回傳 true；</text><text x="261.25" y="136.687" fill="#000" font-size="13" textLength="238.773" font-family="'Microsoft JhengHei'">否則整批拒絕、回傳 false、count 不變。</text><text x="238.5" y="153.978" fill="#000" font-size="13" textLength="365.771" font-family="'Microsoft JhengHei'">getFreeSpace = capacity - count（計算得出，不另存欄位）。</text><text x="238.5" y="171.269" fill="#000" font-size="13" textLength="275.019" font-family="'Microsoft JhengHei'">unload：回傳目前 count 並歸 0；空盒回傳 0。</text><text x="238.5" y="188.56" fill="#000" font-size="13" textLength="341.39" font-family="'Microsoft JhengHei'">不提供 setCount 等任意改存量的方法；欄位一律 private。</text><text x="238.5" y="205.851" fill="#000" font-size="13" textLength="338.92" font-family="'Microsoft JhengHei'">恆成立：1 &lt;= capacity &lt;= 8，0 &lt;= count &lt;= capacity。</text></g><?plantuml-src NLBBRjf05DtxAswp8gegmIwgGgGgQjHMQZTymSGCODNs87keb5QL0D62wo1G4aWKqcpQ4A86DcbLC8IVYMSCAtwXOsmUgNVtSHvpZvza3PJM4AZeWEGec1gcI4UI-LxHiyX06iWgCiqNb1hAVexYrpBH4yf73D6rbIHEePnAzuXEto4